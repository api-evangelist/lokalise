                    custom_translation_statuses: {}
                    task_id: 9147
                  - translation_id: 444949
                    key_id: 331224
                    language_iso: ru
                    translation: '{"one":"","few":"","many":"","other":""}'
                    modified_by: 420
                    modified_by_email: user@mycompany.com
                    modified_at: 2018-12-31 12:00:00 (Etc/UTC)
                    modified_at_timestamp: 1546257600
                    is_reviewed: false
                    reviewed_by: 0
                    words: 0
                    custom_translation_statuses: {}
                    task_id: null
                errors:
                - message: This key name is already taken
                  code: 400
                  key:
                    key_name: index.hello
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/Keys'
      summary: Create keys
      operationId: CreateKeys
      description: 'Creates one or more keys in the project. Requires *Manage keys* admin right. We recommend sending payload in chunks of up to 500 keys per request.


        Requires write_keys OAuth access scope.'
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              keys:
              - key_name: index.welcome
                description: Index app welcome
                platforms:
                - web
                translations:
                - language_iso: en
                  translation: Welcome
              - key_name: index.apple
                description: Welcome apple
                platforms:
                - web
                is_plural: true
                translations:
                - language_iso: en
                  translation:
                    one: I have one apple
                    other: I have a lot of apples
              - key_name: index.hello
                platforms:
                - web
            schema:
              type: object
              properties:
                keys:
                  type: array
                  items:
                    type: object
                    required:
                    - key_name
                    - platforms
                    properties:
                      key_name:
                        type: string
                        description: Key identifier. For projects with enabled Per-platform key names, pass JSON encoded string with included <code>ios</code>, <code>android</code>, <code>web</code> and <code>other</code> string attributes.
                      description:
                        type: string
                        description: Description of the key.
                      platforms:
                        type: array
                        items:
                          type: string
                          enum:
                          - android
                          - ios
                          - other
                          - web
                        description: List of platforms, enabled for this key. Possible values are <code>ios</code>, <code>android</code>, <code>web</code> and <code>other</code>.
                      filenames:
                        type: object
                        properties:
                          ios:
                            type: string
                            description: '"iOS" platform filename.'
                          android:
                            type: string
                            description: '"Android" platform filename.'
                          web:
                            type: string
                            description: '"Web" platform filename.'
                          other:
                            type: string
                            description: '"Other" platform filename.'
                        description: An object containing key filename attribute for each platform.
                      tags:
                        type: array
                        items:
                          type: string
                        description: List of tags for this keys.
                      comments:
                        type: array
                        items:
                          type: object
                          properties:
                            comment:
                              type: string
                              description: The comment message.
                        description: List of comments for this key.
                      screenshots:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              description: Title of the screenshot.
                            description:
                              type: string
                              description: Description of the screenshot.
                            screenshot_tags:
                              type: array
                              items:
                                type: string
                              description: List of screenshot tags.
                            data:
                              type: string
                              description: Base64 encoded screenshot (with leading image type 'data:image/jpeg;base64,').
                        description: List of screenshots, attached to this key.
                      translations:
                        type: array
                        items:
                          type: object
                          properties:
                            language_iso:
                              type: string
                              description: Unique code of the language of the translation.
                            translation:
                              type: string
                              description: The actual translation. Pass as an object, in case it includes plural forms and <code>is_plural</code> is <code>true</code>.
                            is_reviewed:
                              type: boolean
                              description: Whether the translation is marked as Reviewed.
                            is_unverified:
                              type: boolean
                              description: Whether the translation is marked as Unverified.
                            custom_translation_status_ids:
                              type: array
                              items:
                                type: string
                              description: Custom translation status IDs to assign to translation.
                        description: Translations for all languages.
                      is_plural:
                        type: boolean
                        description: Whether this key is plural.
                      plural_name:
                        type: string
                        description: Optional custom plural name (used in some formats).
                      is_hidden:
                        type: boolean
                        description: Whether this key is hidden from non-admins (translators).
                      is_archived:
                        type: boolean
                        description: Whether this key is archived.
                      context:
                        type: string
                        description: Optional context of the key (used with some file formats).
                      char_limit:
                        type: number
                        description: Maximum allowed number of characters in translations for this key.
                      custom_attributes:
                        type: string
                        description: JSON encoded string containing <a href="https://docs.lokalise.com/developer-docs/custom-key-attributes">custom attributes</a> (if any).
                  description: Keys to be added to the project
                use_automations:
                  type: boolean
                  description: Whether to run automations on the new key translations.
      x-operation-id-source: normalized
      x-operation-id-original: Create keys
    put:
      responses:
        '200':
          description: OK
          headers: {}
