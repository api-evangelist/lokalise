      summary: Multi-update
      operationId: BulkUpdate
      description: 'Updates one or more keys in the project. Requires *Manage keys* admin right.


        Requires write_keys OAuth access scope.'
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              keys:
              - key_id: 331223
                key_name: index.welcome
                description: Index app welcome
                platforms:
                - web
              - key_id: 331224
                key_name: index.hello
                description: Index greetings
                platforms:
                - web
            schema:
              type: object
              properties:
                keys:
                  type: array
                  items:
                    type: object
                    required:
                    - key_id
                    properties:
                      key_id:
                        type: number
                        description: A unique identifier of the key.
                      key_name:
                        type: string
                        description: Key identifier. For projects with enabled Per-platform key names, pass JSON encoded string with included <code>ios</code>, <code>android</code>, <code>web</code> and <code>other</code> string attributes.
                      description:
                        type: string
                        description: Description of the key.
                      platforms:
                        type: array
                        items:
                          type: string
                          enum:
                          - android
                          - ios
                          - other
                          - web
                        description: List of platforms, enabled for this key. Possible values are <code>ios</code>, <code>android</code>, <code>web</code> and <code>other</code>.
                      filenames:
                        type: object
                        properties:
                          ios:
                            type: string
                            description: '"iOS" platform filename.'
                          android:
                            type: string
                            description: '"Android" platform filename.'
                          web:
                            type: string
                            description: '"Web" platform filename.'
                          other:
                            type: string
                            description: '"Other" platform filename.'
                        description: An object containing key filename attribute for each platform.
                      tags:
                        type: array
                        items:
                          type: string
                        description: List of tags for this keys.
                      merge_tags:
                        type: boolean
                        description: Enable to merge specified tags with the current tags attached to the key.
                      comments:
                        type: array
                        items:
                          type: object
                          properties:
                            comment:
                              type: string
                              description: The comment message.
                        description: List of comments for this key.
                      screenshots:
                        type: array
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              description: Title of the screenshot.
                            description:
                              type: string
                              description: Description of the screenshot.
                            screenshot_tags:
                              type: array
                              items:
                                type: string
                              description: List of screenshot tags.
                            data:
                              type: string
                              description: Base64 encoded screenshot (with leading image type 'data:image/jpeg;base64,').
                        description: List of screenshots, attached to this key.
                      translations:
                        type: array
                        items:
                          type: object
                          properties:
                            language_iso:
                              type: string
                              description: Unique code of the language of the translation.
                            translation:
                              type: string
                              description: The actual translation. Pass as an object, in case it includes plural forms and <code>is_plural</code> is <code>true</code>.
                            is_reviewed:
                              type: boolean
                              description: Whether the translation is marked as Reviewed.
                            is_unverified:
                              type: boolean
                              description: Whether the translation is marked as Unverified.
                            custom_translation_status_ids:
                              type: array
                              items:
                                type: string
                              description: Custom translation status IDs to assign to translation (existing statuses will be replaced).
                            merge_custom_translation_statuses:
                              type: boolean
                              description: If you do not want statuses to be replaced but instead to be merged with provided then set this to true.
                        description: Translations for all languages.
                      is_plural:
                        type: boolean
                        description: Whether this key is plural.
                      plural_name:
                        type: string
                        description: Optional custom plural name (used in some formats).
                      is_hidden:
                        type: boolean
                        description: Whether this key is hidden from non-admins (translators).
                      is_archived:
                        type: boolean
                        description: Whether this key is archived.
                      context:
                        type: string
                        description: Optional context of the key (used with some file formats).
                      char_limit:
                        type: number
                        description: Maximum allowed number of characters in translations for this key.
                      custom_attributes:
                        type: string
                        description: JSON encoded string containing <a href="https://docs.lokalise.com/developer-docs/custom-key-attributes">custom attributes</a> (if any).
                  description: Keys to update
                use_automations:
                  type: boolean
                  description: Whether to run automations on the updated key translations.
      x-operation-id-source: normalized
      x-operation-id-original: Bulk update
    delete:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              example:
                project_id: 3002780358964f9bab5a92.87762498
                keys_removed: true
                keys_locked: 0
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  keys_removed:
                    type: boolean
                  keys_locked:
                    type: integer
      summary: Delete multiple keys
      operationId: DeleteMultipleKeys
      description: 'Deletes multiple keys from the project. Requires *Manage keys* admin right.


        Requires write_keys OAuth access scope.'
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              keys:
              - 12345
              - 12346
            schema:
              type: object
              required:
              - keys
              properties:
                keys:
                  type: array
                  items:
                    type: string
                  description: List of key ids.
      x-operation-id-source: normalized
      x-operation-id-original: Delete multiple keys
  /projects/{project_id}:{branch}/keys/{key_id}:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              example:
                project_id: 3002780358964f9bab5a92.87762498
                key:
                  key_id: 222222
                  created_at: 2018-12-31 12:00:00 (Etc/UTC)
                  created_at_timestamp: 1546257600
                  key_name:
                    ios: index_welcome
                    android: indexWelcome
                    web: index.welcome
                    other: welcome-index
                  filenames:
                    ios: ''
                    android: ''
                    web: ''
                    other: ''
                  description: Index page welcome
                  platforms:
                  - web
                  - other
                  tags:
                  - main
                  - index
                  comments:
                  - comment_id: 233112
                    comment: Is there an exclamation sign?
                    added_by: 420
                    added_by_email: user@mycompany.com
                    added_at: 2018-12-31 12:00:00 (Etc/UTC)
                    added_at_timestamp: 1546257600
                  screenshots:
                  - screenshot_id: 11233
                    title: Welcome page
                    description: ''
