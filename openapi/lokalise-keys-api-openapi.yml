      summary: Update a key
      operationId: UpdateAKey
      description: 'Updates the properties of a key and it''s associated objects. Requires *Manage keys* admin right.


        Requires write_keys OAuth access scope.'
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
