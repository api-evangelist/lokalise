openapi: 3.2.0
info:
  title: Projects with branches Keys API
  version: 1.0.0
  description: 'Describes the API for projects with branches.\n\n**Project Type Compatibility**: Branching is **only supported for Software projects** (localization_files). Documents and Marketing projects do not support branching. All endpoints in this documentation require Software projects with branching enabled.'
servers:
- url: https://api.lokalise.com/api2
security:
- ApiKeyAuth: []
tags:
- name: Keys
paths:
  /projects/{project_id}:{branch}/keys:
    get:
      responses:
        '200':
          description: OK
          headers:
            X-Total-Count:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  project_id:
                    type: string
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/Keys'
      summary: List all keys
      operationId: ListAllKeys
      description: 'Lists all keys in the project. This endpoint supports cursor pagination for better performance with large datasets. When using cursor pagination, the response will include a nextCursor value in the response headers when more data is available. Continue making requests with the nextCursor value until no nextCursor is returned, indicating all data has been retrieved.


        IMPORTANT: We do not provide a content delivery network for your language files. Do not make a request to this endpoint every time a user visits your website/app. Instead, fetch the results from this endpoint from time to time, store them locally, and serve your visitors with static files/your database content. Alternatively, you may use our File Download endpoint with an Amazon S3/Google CouldStorage integration to automatically upload your language files to a bucket of your choice.


        Requires read_keys OAuth access scope.'
      tags:
      - Keys
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
          type: string
      - name: disable_references
        in: query
        description: Whether to disable key references. Possible values are <code>1</code> and <code>0</code>.
        required: false
        example: '0'
        schema:
          type: number
          enum:
          - '0'
          - '1'
      - name: include_comments
        in: query
        description: Whether to include comments. Possible values are <code>1</code> and <code>0</code>.
        required: false
        example: '0'
        schema:
          type: number
          enum:
          - '0'
          - '1'
      - name: include_screenshots
        in: query
        description: Whether to include URL to screenshots. Possible values are <code>1</code> and <code>0</code>.
        required: false
        example: '0'
        schema:
          type: number
          enum:
          - '0'
          - '1'
      - name: include_translations
        in: query
        description: Whether to include translations. Possible values are <code>1</code> and <code>0</code>.
        required: false
        example: '0'
        schema:
          type: number
          enum:
          - '0'
          - '1'
      - name: include_ai_scoring
        in: query
        description: Whether to include AI scoring (LQA) results as an <code>ai_scoring</code> object on each translation. Possible values are <code>1</code> and <code>0</code>. Only applies when <code>include_translations</code> is <code>1</code>. The object is <code>null</code> when no score is stored for the translation. Scores are produced by the AI scoring feature (for example an automatic translation task with <code>include_ai_score</code>) and are a signal for human review, not a final quality verdict.
        required: false
        example: '0'
        schema:
          type: number
          enum:
          - '0'
          - '1'
      - name: filter_translation_lang_ids
        in: query
        description: One or more language ID to filter by (comma separated). Will include translations only for listed IDs.
        required: false
        schema:
          type: string
      - name: filter_tags
        in: query
        description: One or more tags to filter by (comma separated).
        required: false
        schema:
          type: string
      - name: filter_filenames
        in: query
        description: One or more filenames to filter by (comma separated).
        required: false
        schema:
          type: string
      - name: filter_keys
        in: query
        description: One or more key name to filter by (comma separated). In case "Per-platform keys" is enabled in project settings, the filter will be applied to all platform names.
        required: false
        schema:
          type: string
      - name: filter_key_ids
        in: query
        description: One or more key identifiers to filter by (comma separated).
        required: false
        schema:
          type: string
      - name: filter_platforms
        in: query
        description: One or more platforms to filter by (comma separated). Possible values are <code>ios</code>, <code>android</code>, <code>web</code> and <code>other</code>.
        required: false
        schema:
          type: string
      - name: filter_untranslated
        in: query
        description: Filter by untranslated keys. Possible values are <code>1</code> and <code>0</code>.
        required: false
        example: '0'
        schema:
          type: number
          enum:
          - '0'
          - '1'
      - name: filter_qa_issues
        in: query
        description: One or more QA issues to filter by (comma separated). Possible values are <code>spelling\_and\_grammar</code>, <code>placeholders</code>, <code>html</code>, <code>url\_count</code>, <code>url</code>, <code>email\_count</code>, <code>email</code>, <code>brackets</code>, <code>numbers</code>, <code>leading\_whitespace</code>, <code>trailing\_whitespace</code>, <code>double\_space</code>, <code>special\_placeholder</code> and <code>unbalanced\_brackets</code>.
        required: false
        schema:
          type: string
      - name: filter_archived
        in: query
        description: One archived filter. Possible values are <code>include</code>, <code>exclude</code> and <code>only</code>.
        required: false
        example: include
        schema:
          type: string
          enum:
          - exclude
          - include
          - only
      - name: pagination
        in: query
        description: Type of pagination. Possible values are <code>offset</code> and <code>cursor</code>. The default value is <code>offset</code>. Cursor pagination is performance-optimized and does not count total records or calculate remaining pages. When using cursor pagination, continue making requests until no <code>nextCursor</code> is returned in the response headers.
        required: false
        example: offset
        schema:
          type: string
          enum:
          - offset
          - cursor
      - name: limit
        in: query
        description: Number of items to include (max 500).
        required: false
        example: '100'
        schema:
          type: integer
      - name: page
        in: query
        description: Return results starting from this page.
        required: false
        example: '1'
        schema:
          type: integer
      - name: cursor
        in: query
        description: Return results starting from this cursor. When using cursor pagination, this parameter should contain the <code>nextCursor</code> value from the previous response. Continue pagination until no <code>nextCursor</code> is returned in the response headers.
        required: false
        schema:
          type: string
      x-operation-id-source: normalized
      x-operation-id-original: List all keys
    post:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              example:
                project_id: 3002780358964f9bab5a92.87762498
                keys:
                - key_id: 331223
                  created_at: 2018-12-31 12:00:00 (Etc/UTC)
                  created_at_timestamp: 1546257600
                  key_name:
                    ios: index.welcome
                    android: index.welcome
                    web: index.welcome
                    other: index.welcome
