      summary: Create a task
      operationId: CreateATask
      description: 'Creates a task in the project. Requires *Manage tasks* admin right.

        Keep in mind, that initial_tm_leverage attribute will be empty in server response. It''s being calculated after the task is created and this process may take some time.


        Requires write_tasks OAuth access scope.'
      tags:
      - Tasks
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              title: Voicemail messages
              description: Need your help with some voicemail message translation. Thanks!
              due_date: '2024-12-31 12:00:00'
              keys:
              - 11212
              - 11241
              - 11245
              languages:
              - language_iso: fi
                users:
                - 421
              - language_iso: ru
                groups:
                - 191
              source_language_iso: en
              auto_close_languages: true
              auto_close_task: true
              auto_close_items: true
              task_type: translation
              parent_task_id: 12345
              closing_tags:
              - tag_one
              - tag_two
              do_lock_translations: true
              custom_translation_status_ids:
              - 77
              - 85
              - 86
            schema:
              type: object
              required:
              - title
              properties:
                title:
                  type: string
                  description: Task title.
                description:
                  type: string
                  description: Brief task description. Used as instructions for AI in <code>automatic_translation</code> and <code>lqa_by_ai</code> task types.
                due_date:
                  type: string
                  description: 'Due date in <code>Y-m-d H:i:s</code> format. Example: "2024-12-24 23:59:59"'
                keys:
                  type: array
                  items:
                    type: string
                  description: List of keys identifiers, included in task. Required if <code>parent_task_id</code> is not specified
                languages:
                  type: array
                  items:
                    type: object
                    required:
                    - language_iso
                    properties:
                      language_iso:
                        type: string
                        description: Language code.
                      users:
                        type: array
                        items:
                          type: string
                        description: List of user identifiers assigned to work on the language. **Must** be omitted for `automatic_translation` and `lqa_by_ai` task types.
                      groups:
                        type: array
                        items:
                          type: string
                        description: List of user-group identifiers assigned to work on the language. **Must** be omitted for `automatic_translation` and `lqa_by_ai` task types.
                  description: List of languages in the task. For <code>automatic_translation</code> and <code>lqa_by_ai</code> task types, unsupported languages will be ignored and returned in <code>skipped_languages</code> in the response.
                source_language_iso:
                  type: string
                  description: Source language code for the task. Falls back to project base language if not provided.
                auto_close_languages:
                  type: boolean
                  description: Whether languages should be closed automatically upon completion of the last item. **Must** be <code>true</code> or omit the property for `automatic_translation` and `lqa_by_ai` task types.
                auto_close_task:
                  type: boolean
                  description: Whether the task should be automatically closed upon all language completion. **Must** be <code>true</code> or omit the property for `automatic_translation` and `lqa_by_ai` task types.
                auto_close_items:
                  type: boolean
                  description: Whether the <code>translation</code> task items should be automatically marked as completed on edit. **Must** be <code>true</code> or omit the property for `automatic_translation` and `lqa_by_ai` task types.
                task_type:
                  type: string
                  default: translation
                  enum:
                  - translation
                  - automatic_translation
                  - lqa_by_ai
                  - review
                  description: Specify if task type is <code>translation</code> (default), <code>automatic_translation</code>, <code>lqa_by_ai</code> or <code>review</code>.
                parent_task_id:
                  type: number
                  description: If <code>task_type</code> is <code>review</code>, it can have a parent task. Current task will be opened when parent task is closed.
                closing_tags:
                  type: array
                  items:
                    type: string
                  description: Tags that will be added to affected keys when task is closed.
                do_lock_translations:
                  type: boolean
                  description: If set to true, will lock translations for non-assigned project members.
                custom_translation_status_ids:
                  type: array
                  items:
                    type: string
                  description: IDs of custom translation statuses that will be applied to task items after item is completed.
                save_ai_translation_to_tm:
                  type: boolean
                  default: false
                  description: Save AI translations to Translation Memory. Only applicable for tasks with <code>task_type</code> set to <code>automatic_translation</code>. Defaults to false.
                apply_ai_tm100_matches:
                  type: boolean
                  default: false
                  description: Apply 100% translation memory matches. Only applicable for tasks with <code>task_type</code> set to <code>automatic_translation</code>. Defaults to false.
                mark_verified:
                  type: boolean
                  default: true
                  description: Mark translations as verified. Only applicable for tasks with <code>task_type</code> set to <code>automatic_translation</code>. Defaults to true.
                translate_all_segments:
                  type: boolean
                  default: false
                  description: Translate all segments including those with existing translations or TM matches. Only applicable for tasks with <code>task_type</code> set to <code>automatic_translation</code> in projects with segmentation enabled. When false, only empty segments will be translated. This parameter can only be set during task creation and cannot be modified or retrieved afterwards. Defaults to false.
                include_ai_score:
                  type: boolean
                  default: false
                  description: Run AI scoring (LQA) on task translations once automatic translation completes. Only applicable for tasks with <code>task_type</code> set to <code>automatic_translation</code> and requires the AI scoring feature in your plan. Defaults to false.
                translation_engine:
                  type: string
                  default: ai
                  enum:
                  - ai
                  - deepl
                  - google
                  description: 'Engine that produces the automatic translations: <code>ai</code> (default), <code>deepl</code> or <code>google</code>. Only applicable for tasks with <code>task_type</code> set to <code>automatic_translation</code>; for every other task type the parameter should be omitted. The machine translation engines (<code>deepl</code>, <code>google</code>) cannot be combined with <code>save_ai_translation_to_tm</code> or <code>include_ai_score</code>. Unlike <code>ai</code>, which skips languages it cannot handle and reports them in <code>skipped_languages</code>, a machine translation engine rejects the whole request with a 400 error when it cannot translate one of the requested language pairs. This parameter can only be set during task creation and cannot be modified or retrieved afterwards.'
      x-operation-id-source: normalized
      x-operation-id-original: Create a task
