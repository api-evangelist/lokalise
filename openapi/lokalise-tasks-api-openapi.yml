      summary: List all tasks
      operationId: ListAllTasks
      description: 'Lists all tasks in the project.


        Requires read_tasks OAuth access scope.'
      tags:
      - Tasks
      parameters:
      - name: project_id
        in: path
        description: A unique project identifier
        required: true
        schema:
          type: string
      - name: branch
        in: path
        description: Branch name
        required: true
        schema:
          type: string
      - name: filter_title
        in: query
        description: Set title filter for the list.
        required: false
        schema:
          type: string
      - name: filter_statuses
        in: query
        description: 'One or more task statuses to filter by (comma separated). Possible values are <code>created</code>, <code>queued</code>, <code>in\_progress</code> and <code>completed</code>.

          '
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Number of items to include (max 5000).
        required: false
        example: '100'
        schema:
          type: integer
      - name: page
        in: query
        description: Return results starting from this page.
        required: false
        example: '1'
        schema:
          type: integer
