components:
  schemas:
    Tasks:
      type: object
      properties:
        task_id:
          type: number
          description: A unique task identifier.
        title:
          type: string
          description: Task title.
        description:
          type: string
          description: Short description of the task.
        status:
          type: string
          description: Status of the task. Allowed values are <code>completed</code>, <code>in_progress</code>, <code>created</code>, <code>queued</code>.
        progress:
          type: number
          description: Task progress in percents (0% - 100%).
        due_date:
          type: string
          description: Due date.
        due_date_timestamp:
          type: number
          description: Unix timestamp of the Due date.
        keys_count:
          type: number
          description: Total number of keys in the task.
        words_count:
          type: number
          description: Total number of source words in the task.
        created_at:
          type: string
          description: Date and time of the task creation.
        created_at_timestamp:
          type: number
          description: Unix timestamp when the task was created.
        created_by:
          type: number
          description: Identifier of a user, who has created the task.
        created_by_email:
          type: string
          description: E-mail of a user, who has created the task.
        can_be_parent:
          type: boolean
          description: Can task be assigned as a parent task.
        task_type:
          type: string
          default: translation
          enum:
          - translation
          - automatic_translation
          - lqa_by_ai
          - review
          description: <code>translation</code>, <code>automatic_translation</code>, <code>lqa_by_ai</code> or <code>review</code>.
        parent_task_id:
          type: number
          description: ID of the parent task.
        closing_tags:
          type: array
          items: {}
          description: Tags that will be added to affected keys when task is closed.
        do_lock_translations:
          type: boolean
          description: If set to true, will lock translations for non-assigned project members.
        languages:
          type: array
          items:
            type: object
            properties:
              language_iso:
                type: string
                description: Language code.
              language_id:
                type: number
                description: A unique language identifier in the system.
              language_name:
                type: string
                description: Language name.
              users:
                type: array
                items: {}
                description: List of users, assigned to work on the language.
              groups:
                type: object
                properties:
                  group:
                    type: object
                    properties:
                      id:
                        type: number
                        description: A unique identifier of the user group.
                      name:
                        type: string
                        description: Name of the group.
                description: List of groups, assigned to work on the language.
              keys:
                type: array
                items: {}
                description: List of keys identifiers, included in task for this language.
              status:
                type: string
                description: Status of the language in the task. Allowed values are <code>completed</code>, <code>in progress</code>, <code>created</code>.
              progress:
                type: number
                description: Language progress in percents (0% - 100%).
              initial_tm_leverage:
                type: object
                deprecated: true
                description: Deprecated. We return data for compatibility, but please, rely on "tm_leverage" instead.
                properties:
                  0%+:
                    type: number
                    description: Number of words with TM match from 0% to 60%.
                  60%+:
                    type: number
                    description: Number of words with TM match from 60% to 75%.
                  75%+:
                    type: number
                    description: Number of words with TM match from 75% to 95%.
                  95%+:
                    type: number
                    description: Number of words with TM match from 95% to 100%.
                  100%:
                    type: number
                    description: Number of words with TM 100% match.
              tm_leverage:
                type: object
                description: Translation Memory leverage calculated for a task. It indicates how many words translators can fetch from the memory instead of translating everything from scratch. For large tasks it may take time to calculate TM leverage after the task creation. If the "status" is "pending", you will see null value and need to retrieve the data again (with a small delay).
                example:
                  status: completed
                  value:
                    0%+: 30
                    50%+: 0
                    75%+: 0
                    85%+: 0
                    95%+: 0
                    100%: 0
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - completed
                    description: Status of the translation memory leverage.
                  value:
                    type:
                    - object
                    - 'null'
                    properties:
                      0%+:
                        type: number
                        description: Number of words with TM match from 0% to 50%.
                      50%+:
                        type: number
                        description: Number of words with TM match from 50% to 75%.
                      75%+:
                        type: number
                        description: Number of words with TM match from 75% to 85%.
                      85%+:
                        type: number
                        description: Number of words with TM match from 85% to 95%.
                      95%+:
                        type: number
                        description: Number of words with TM match from 95% to 100%.
                      100%:
                        type: number
                        description: Number of words with TM 100% match.
              keys_count:
                type: number
                description: Number of keys for the language.
              words_count:
                type: number
                description: Number of source words for the language.
              done_words_count:
                type: number
                description: Number of translated words for the language.
              completed_at:
                type: string
                description: Date and time of the language completion.
              completed_at_timestamp:
                type: number
                description: Unix timestamp when the language was completed.
              completed_by:
                type: number
                description: Identifier of a user, who has completed the language.
              completed_by_email:
                type: string
                description: E-mail of a user, who has completed the language.
          description: List of languages in the task.
        source_language_iso:
          type: string
          description: Source language code of the task.
        auto_close_languages:
          type: boolean
          description: Whether languages should be closed automatically upon completion of the last item.
        auto_close_task:
          type: boolean
          description: Whether the task should be automatically closed upon all language completion.
        auto_close_items:
          type: boolean
          description: Whether the <code>translation</code> task items should be automatically marked as completed on edit.
        completed_at:
          type: string
          description: Date and time of the task completion.
        completed_at_timestamp:
          type: number
          description: Unix timestamp when the task was completed.
        completed_by:
          type: number
          description: Identifier of a user, who has completed the task.
        completed_by_email:
          type: string
          description: E-mail of a user, who has completed the task.
        custom_translation_status_ids:
          type: array
          items: {}
          description: IDs of custom translation statuses that will be applied to task items after item is completed.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Token
