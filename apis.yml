aid: lokalise
url: https://raw.githubusercontent.com/api-evangelist/lokalise/refs/heads/main/apis.yml
name: Lokalise
kind: company
description: Lokalise is a translation management system (TMS) for software, mobile,
  web, games, and documentation. It pairs collaborative localization workflows with
  AI machine translation and a full-coverage REST API (APIv2) that exposes projects,
  keys, translations, files, contributors, screenshots, snapshots, tasks, branches,
  glossaries, webhooks, and payments. Official SDKs are maintained for Node.js, Python,
  Ruby, PHP, Go, Java, .NET, and Elixir.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Localization
