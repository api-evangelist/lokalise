apis:
- aid: lokalise:api-v2
  name: Lokalise API v2
  description: Full-coverage REST API for the Lokalise TMS. Resources include projects,
    keys, translations, contributors, files, comments, screenshots, snapshots, teams,
    team users, team user groups, branches, languages, tasks, glossaries, webhooks,
    payments, and orders. Authentication is via API token in the X-Api-Token header
    or OAuth 2.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
